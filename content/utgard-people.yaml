- title: Демоны, чудовища и адские звери
  paragraphs:
  - Утгардская империя — держава Сурта в мире демонов. В повествовании «демонами» называют народ, к которому принадлежат Владыка и Локи. Слово «чудовища» шире. В одной из сцен так называют и орка, и гоблина. Когда Локи осматривает армию Фенрир в Трудхейме, он упоминает демонов и адских зверей по отдельности.

- title: Как наследник доказывает своё право на трон
  paragraphs:
  - На совет наследников Сурта приходят сёстры Хель, Фенрир и Йорм, а также Имир. После казни Фарбы его сын Локи лишился своего демонического оружия. Право владеть таким оружием принадлежит семье Владыки. Без него Локи уступает родичам и в бою, и при дворе.
  - У Локи остаётся знак Владыки на тыльной стороне ладони. Он подтверждает, что принц принадлежит к императорскому роду. Локи предлагает этот знак в залог, чтобы его допустили к борьбе за престол. Сурт соглашается и назначает испытание. Владыкой станет тот, кто принесёт ему Сердце Иггдрасиля.
  image: scenes/utgard-audience
  caption: Зал аудиенций Утгарда. На сцене перед занавесом собираются наследники Сурта.

- title: На службе у Владыки и его семьи
  paragraphs:
  - Последние годы Сурт принимает посетителей из-за занавеса. Большинство его распоряжений передаёт Мения. На совете наследников именно к ней обращается Имир, когда хочет, чтобы Владыка выслушал Локи. Даже членам императорской семьи приходится считаться с тем, чей голос они обычно слышат вместо голоса Сурта.
  - Мения и Фена происходят из разорившейся знатной семьи. Сёстры унаследовали парные магические зонты Нифльхейм и Ванахейм, но оказались при разных господах. Фарба взял Фену под свою защиту. Позже она обучала Локи этикету и магии, а в походе выходила с ним на поле боя и укрывала его барьером.

- title: Лупольды в отряде Гарма
  paragraphs:
  - Гарм — наёмник и стрелок из волчьего народа лупольдов. Он служил Фарбе, а на Иггдрасиль отправился помощником Локи. При подлёте к Эдде Гарм первым докладывает о всадниках на пегасах. Позже, когда воздушный отряд Хель преследует «Синмару», Гарм встречает его в лесу со своими лупольдами.
  - Лупольды перебираются с ветки на ветку и стреляют из арбалетов сверху. В том бою деревья мешают всадникам Хель маневрировать, и отряд Гарма задерживает погоню. За эту работу Гарм просит Локи угостить его пивом. Просьбу он добавляет в конце боевого донесения.
  image: scenes/sinmara-deck
  caption: Мостик «Синмары». Здесь Гарм докладывает Локи о всадниках на пегасах у границы Эдды.

- title: Звери Фенрир и всадники Хель
  paragraphs:
  - Под Трудхеймом адские звери идут впереди войска Фенрир и прорываются через центр строя Тор. Амазонки пропускают их и встречают за своей линией отрядом, который Тор ведёт лично. В другом бою Фенрир отправляет вперёд суккубов и инкубов. Ночью они узнают у противника, где стоят его отряды, и находят проход к лагерю для остального войска.
  - Хель держит грифонов, виверн и василисков. Её бойцы используют их как верховых животных для воздушного боя. Однажды Локи застаёт Хель на палубе за разговором со стаей. Один из зверей рычит на него и успокаивается, когда Хель гладит его по шее.

- title: Войска наследников и армия Владыки
  paragraphs:
  - В начале похода наследники распоряжаются каждый своим войском. Когда Имир добивается, чтобы двор объявил Локи врагом империи, Сурт приказывает заново собрать имперскую армию для похода на Иггдрасиль. Командование получает Имир. Хель сомневается в его намерениях, но принимает приказ деда.
  - У Сурта есть собственное войско. Оно служит на «Театре», флагмане Владыки, которым даже императорская семья не вправе распоряжаться. Когда корабль вступает в бой, его артиллеристы стреляют и по отрядам Имира. Тот возмущён, но Мения считает обстрел исполнением своего долга перед Суртом.
