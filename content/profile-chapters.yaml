Loki:
- title: Чёрный ящик «Синмары»
  paragraphs:
  - Во время ремонта «Синмары» Локи вскрывает узел, который инженеры мира демонов прозвали чёрным ящиком. Под крышкой столько переплетённых контуров, что даже он теряется. Локи предполагает, что эта магическая формула позволяет кораблю ходить между мирами. Возможно, маги времён Рагнарёка управляли ею с помощью отдельного кода.
  - Фена предупреждает, что если узел сломается, починить его будет некому. Локи прижимает пергамент к контурам и выжигает на нём их рисунок слабым импульсом тёмной энергии. Он просит Фену помочь с расшифровкой. Она сама учила его составлять магические формулы, но сейчас у неё полно работы. Локи забирает копию, чтобы разобраться самому.
  spoiler: false
Fena:
- title: Ванахейм и Нифльхейм
  paragraphs:
  - На учениях лучники Гарма с высоты осыпают стрелами отряд Локи. Фена раскрывает Ванахейм, и над отрядом встаёт барьер. Пока лучники отвлечены, другой отряд поднимается к ним и застаёт их врасплох. Гарму приходится поднять белый флаг.
  - Ванахейм и Нифльхейм когда-то хранились в семье Фены как пара. Теперь сёстры служат разным хозяевам. Ванахейм защищает Локи, а Нифльхейм Мении — Сурта. Род Фены давно пришёл в упадок, и она говорит о нём редко. Родителям она благодарна за зонт. А возрождать род ей некогда, шутит Фена, с одним Локи хлопот по горло.
  spoiler: false
Garm:
- title: Ставка на Локи
  paragraphs:
  - При виде Локи Гарм прячет за спиной листок со ставками на нового Владыку демонов. Фена вытягивает у него листок и возмущается. Фавориты — Хель и Имир, у Локи меньше всего шансов, а на карикатуре он трясётся за спиной Хель.
  - Локи спрашивает, на кого поставил Гарм. Тот мнётся и отговаривается тем, что исход борьбы за престол интересует всех. Локи же прикидывает, сколько заплатят за его победу, и предлагает Гарму поставить весь оклад. Под взглядом Фены Гарм тут же обещает поставить на командира и хохочет. С такими выплатами, по его словам, это почти жульничество.
  spoiler: false
Tyrca:
- title: Тирка защищает мост
  paragraphs:
  - После неудачной стычки войско отходит за реку, и Локи предлагает разрушить мост, чтобы задержать погоню. Тирка возражает. Люди гибли на переправе, пока моста ещё не было, да и сама стройка стоила жизней. Фена напоминает, что без моста войску тоже придётся идти в обход.
  - Если Локи решает сохранить мост, Тирка с помощью Нибелунга призывает духов его строителей. Мастера успевают возвести несколько рядов заграждений, у которых противник попадает под обстрел и отходит. Тирка благодарит Локи, а тот уверяет, что выбрал самый выгодный план. Гарм слышал весь спор и просит его хотя бы себе не врать.
  spoiler: true
Thor:
- title: Тор на учениях амазонок
  paragraphs:
  - На учениях Тор сводит в бою два отряда амазонок. Новобранцы уже поспевают за ветеранами, но проигрывают. Тор говорит их командиру, что та слишком поздно отреагировала на удар по правому флангу. Локи считает, что за такой бой другой отряд и ругать бы не стали.
  - Тор хочет, чтобы амазонки были сильнейшим войском Иггдрасиля. Локи спрашивает, все ли воительницы готовы тратить молодость на учения и годами носить шрамы от ран, которые у богини быстро заживают. Тор отвечает, что амазонки сами выбрали эту жизнь. Она снова делит их на отряды и предлагает двум выступить против третьего, который возглавит сама. Амазонки встречают вызов криками.
  spoiler: false
Freya:
- title: Кого скрывает Ослепительный свет
  paragraphs:
  - Во время похода в Фольк войску Локи мешает отряд убийц, которых нельзя заметить. После поражения Фрейя объясняет, что так действует её заклинание «Ослепительный свет». Чем крепче вера бойцов в богиню, тем дольше она может скрывать их. При Фрейе этот отряд выполнял её поручения в Фольке. Локи подозревает, что среди них были и дела, о которых подданным не рассказывали.
  - Локи хочет взять отряд к себе, но Фрейя сомневается, что её магия ещё подействует как прежде. Бойцы могли разувериться в ней после поражения. Самого Локи она, по её прикидке, сможет скрыть на несколько минут. Ему и этого хватит.
  spoiler: true
Rigret:
- title: По каким книгам Ригрет училась воевать
  paragraphs:
  - Когда отряд Ригрет возвращается с победой почти без потерь, Локи спрашивает, где она научилась командовать. Услышав о вторжении демонов, Ригрет засела за описания сражений Рагнарёка и труды полководцев. В мире демонов эти записи давно утрачены. В Гладсе они сохранились, и Локи признаёт в них отличные учебники по тактике.
  - Локи просит доставить на «Синмару» те самые книги, которые читала Ригрет. Потом хвалит её за то, что она сумела применить прочитанное, и гладит по голове. Ригрет всё равно переспрашивает, точно ли это похвала.
  spoiler: true
Odin:
- title: Партия Один и Локи
  paragraphs:
  - Один зовёт Локи сыграть в игру с парящего континента. У каждого по десять видов фигур, победа достаётся тому, кто возьмёт вражеского короля. Один замечает, что прежде только Фрейя доставляла ей столько хлопот за доской. Локи вывел вперёд рыцаря, но Один видит, что опаснее его лучник.
  - За доской Локи спрашивает, не придётся ли им воевать друг с другом после победы над общими врагами. Один допускает и такой исход. Она обещает помогать Локи, пока он сражается ради порядка. Затем пускает конницу с двух сторон. Локи предвидел этот ход, отбивает атаку и загоняет её короля в угол. После партии оба говорят, что надеются никогда не встретиться в бою.
  spoiler: true
Hel:
- title: Хель зовёт Локи на тренировку
  paragraphs:
  - Когда в армии Локи начинают служить люди и демоны, Хель удерживает своих сородичей от ссор с новыми союзниками. После общих учений она уводит отряд с поля в таком же порядке, в каком вывела его на бой. Локи, наблюдавший с холма, при Гарме называет Хель самым надёжным из своих союзников.
  - Хель замечает, что сам Локи так и не спустился с холма. Он хотел увидеть, как ведут себя его отряды, а Хель спрашивает, чего он ждёт от солдат, если они не видят командира рядом. По её мнению, он ещё и слишком привык полагаться в бою на Хведрунга. Хель берёт Локи за руку и тянет на тренировку. Если он соглашается, Гарм удивляется, что уговорить его сумел кто-то кроме Фены.
  spoiler: true
Fenrir:
- title: Ночной налёт Фенрир
  paragraphs:
  - Армия Локи находит в лесу вражеский лагерь. Ночью между деревьями трудно держать связь, поэтому впереди идут суккубы и инкубы Фенрир. Они выманивают у дозорных сведения о расположении сил и находят проход к лагерю. Основному войску остаётся пройти следом. Налёт удаётся, командир противника погибает.
  - Утром Фенрир застаёт Локи за донесениями. Он хвалит её, так и не подняв глаз от бумаг. Тогда Фенрир напоминает об уговоре насчёт трёх вражеских командиров. Локи отвечает, что ей осталось двое. Фенрир обещает добыть ещё две головы и уходит вприпрыжку.
  spoiler: true
Jorm:
- title: Йорм за штурвалом «Синмары»
  paragraphs:
  - Когда путь «Синмаре» преграждают дрейфующие в воздухе обломки Иггдрасиля, Локи собирается взять их в обход. Йорм перехватывает штурвал и так кренит корабль, что Локи падает. Он хочет оттащить её от штурвала, но Гарм удерживает его. Йорм уже ведёт корабль между скалами, и вырывать у неё управление на ходу опасно.
  - Йорм выводит «Синмару» из обломков, даже не сбавив скорости. Благодаря ей корабль приходит вовремя, и Локи признаёт, что она умеет пилотировать. Тут же он запрещает ей впредь браться за штурвал без разрешения. Обход занял бы чуть больше времени, зато экипажу не пришлось бы смотреть, как на него несётся скала.
  spoiler: true
Ymir:
- title: Страница с именами сестёр
  paragraphs:
  - Тирка разрубает Книгу имён святилища, но Имир заранее вынул из неё лист с именами Хель, Фенрир и Йорм. Отдельная страница сохраняет силу оружия. Имир говорит, что получил имена ещё до борьбы за престол, пока сёстры ему доверяли. Он ждёт, пока Локи решит, что проклятие снято, и только тогда зовёт Хель и Фенрир. С их помощью он захватывает Локи и забирает ключ Синмары.
  - На «Театре» Имир сам идёт против Сурта и в конце концов возвращает ключ Локи. Перед смертью он признаётся, что пытался добыть и его имя. Сколько бы Имир ни помогал кузену, тот так и не стал ему доверять.
  spoiler: true
Menia:
- title: Големы Мении на «Театре»
  paragraphs:
  - Во время штурма «Театра» Локи натыкается на раненую Мению. Фрейя требует вернуть Брисингамен, который та у неё отняла. Мения отказывается. На корабле поднимается тревога, и отряд Локи окружают големы. Мения признаёт, что именно она открыла Йорм доступ к заводу в Гладсе. Она разобралась в устройстве древней линии и наладила такое же производство на флагмане Сурта.
  - Один разбивает големов, но те снова поднимаются. Мения рассчитывает, что на каждую такую машину богиням придётся тратить силу, которая ещё понадобится в бою с Суртом. Пока Фена заслоняет отряд Ванахеймом, она зовёт сестру к себе, чтобы перевязать её. Мения даже сейчас отказывается принять помощь.
  spoiler: true
Surt:
- title: Зачем Сурт сохранил тело Синмары
  paragraphs:
  - Когда Синмара гибнет, Один извлекает её душу и лишает прежней памяти. Из этой души рождается Тирка. Часть чувств Синмары остаётся в теле. Сурт забирает его раньше, чем Один успевает что-либо сделать, и прячет в Гробу судьбы Ле Ветейн. Он уже знает, что однажды его собственное тело одряхлеет.
  - После удара Имира Сурт обретает тело Синмары и получает доступ к божественной силе. На «Театре» Сурт видит, что Локи колеблется, узнав об участи матери. Сурт говорит с ним от её имени и протягивает руку за ключом. Ответ Локи меняет исход сражения и определяет, продолжится ли война после гибели Сурта.
  spoiler: true
Hvedrung:
- title: Хведрунг говорит с Локи без ключа
  paragraphs:
  - После боя в Эдде Локи снова разглядывает ключ. Стоит ему произнести имя Хведрунга, как тот отзывается у него в голове. С этого момента ключ нужен лишь для того, чтобы Хведрунг мог перехватить управление телом. Даже тогда время превращения ограничено.
  - Фена слышит, как Локи разговаривает сам с собой. Он пересказывает ей, что узнал в бою. Вместе со сменой облика Андвара пробуждается как Варанарт. Фена принимает Хведрунга за силу, которую Локи носил в себе. Сам Локи видит в нём того, кем мог бы стать, если бы обладал силой Владыки демонов. Хведрунг слышит, о чём думает Локи, и тут же даёт ему об этом знать.
  spoiler: true
