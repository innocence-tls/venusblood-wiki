- title: Эдда. Поединок Тирки и Локи
  paragraphs:
  - К концу похода Тирка подстерегает отряд Локи в ущелье. Яд Гарма ослабляет богиню, но она выжигает его божественной силой и швыряет Локи в скалу. Локи вспоминает, как Синмара вручила ему ключ, и впервые поворачивает его в собственном сердце. Бой продолжает Хведрунг. Его алебарда Варанарт поглощает силу Тирки.
  - Локи останавливает Хведрунга перед последним ударом и берёт Тирку в плен. Она успела увидеть его воспоминания и знает, ради кого он начал войну. После победы Эдда снабжает армию Локи, а тот получает возможность наступать на одну из четырёх оставшихся земель.
  spoiler: true
  scene: t102
  image: scenes/tyrca-nibelung

- title: Фольк. Оборона Фрейи и мельницы
  paragraphs:
  - В Фольке Локи заключает временный союз с Имиром. Пока один отвлекает защитников, другой атакует их укрепления. Войско теряет людей из-за стрел Фрейи, способных подчинять тех, кого они ранили. В решающий момент Фрейя скрывает и саму стрелу. Фена успевает заслонить Локи и получает тяжёлую рану. С подходом людских подкреплений Локи отступает.
  - Чтобы города перестали посылать Фрейе солдат, Локи приказывает остановить мельницы магией. В каждом краю остаётся хотя бы одна рабочая мельница, у которой и собираются местные защитники. Фрейя теряет подкрепления и проигрывает. После победы Локи получает помощь богини и её бойцов в плащах. Мельницы начинают восстанавливать.
  spoiler: true
  scene: s402, s403, t402, s404
  image: chapters/b

- title: Трудхейм. Фенрир и мятеж против Тор
  paragraphs:
  - На юге Локи застаёт войну между Фенрир и Тор. Мьёльнир обращает войско Фенрир в бегство, после чего она предлагает Локи союз. Если он соглашается, Фенрир посылает к нему своих инкубов, а позже её суккубы захватывают сразу несколько его опорных пунктов. Локи даёт отпор, и после поражения Фенрир на время переходит к нему.
  - Пока Фенрир поднимает мятеж среди жителей Трудхейма, Локи осаждает храм Тор. Богиня держит Мьёльнир наготове, но бросок заденет жителей у храма. Она принимает вызов Локи и соглашается сдаться в случае поражения. В поединке Хведрунг повреждает рукавицу Ярнгрейпр и выдерживает ослабленный удар секиры. Тор признаёт поражение. Пока амазонки сдаются, Фенрир угоняет малый корабль и покидает Трудхейм.
  spoiler: true
  scene: t201, s201, s202, s203, t202
  image: chapters/c

- title: Гладс. Големы Йорм и Гьяллархорн
  paragraphs:
  - У ледяной реки Ригрет усиливает своих солдат Гьяллархорном и ослабляет им отряд Локи. Она видит, что Тирка сражается вместе с демонами, и решает, что сестру вынудили. После отступления Ригрет на поле выходят големы Йорм. По подсказке Мении Йорм нашла завод времён Рагнарёка и вновь запустила производство.
  - Если Локи берёт завод, он может захватить Йорм и предложить ей вступить в армию. От решения зависит, останется ли она его союзницей. Против големов проклятие Гьяллархорна бессильно. В последнем сражении даже речной флагман Ригрет с тараном-сверлом не спасает её от поражения. Локи предлагает ей сдаться и присоединиться к Тирке.
  spoiler: true
  scene: t301, s302, s303, t302
  image: chapters/d

- title: Вальхалла. Копьё Один
  paragraphs:
  - В центре континента наступление сдерживает Гунгнир. Один поражает им войска на расстоянии, пока Хель обрушивает на Вальхаллу бури. Локи может пообещать Хель временный союз или отвергнуть её условия. После столкновения с кузеном Хель встаёт на его сторону против Один.
  - Локи выясняет, что Один чаще всего выпускает Гунгнир из столицы. Пока Хель отвлекает богиню, Локи с Тиркой проникают в храм и разбивают камень, который питал копьё. Один ещё может метать Гунгнир за счёт собственной силы. Локи предвидит это, одерживает победу в поединке и добивается её помощи.
  spoiler: true
  scene: t501, s502, s503, t502, s504
  image: chapters/e

- title: Хранитель ключа. Имир и культ Конца Света
  paragraphs:
  - После походов Утгард отзывает Хель, Фенрир и Йорм. Имир собирает имперскую армию и объявляет поход против Локи. Тем временем люди стекаются в Фольк к культу Конца Света. Имир обещает спасти тех, чьи имена попадут в его книгу. Записав их, он получает власть над паломниками и забирает их силу.
  - Тирка рассекает Книгу имён святилища под алтарём и освобождает паломников. Но Имир сохранил страницу с именами сестёр и с её помощью захватывает Локи. Имир снимает с него ключ, а Мения узнаёт в нём Сердце Иггдрасиля. Синмара унесла его в мир демонов ещё до рождения сына. Имир рассказывает Локи, что его мать была богиней и погибла много лет назад.
  spoiler: true
  scene: s601, s602, s603
  image: chapters/f

- title: На борту «Театра». Сурт и Синмара
  paragraphs:
  - Локи и богини поднимаются на флагман Сурта вслед за Имиром. Имир ранит Мению и восстаёт против деда. Он губит старое тело Сурта, но тот вселяется в сохранённое тело Синмары. Теперь Сурт владеет и тёмной, и божественной силой. Перед смертью Имир возвращает ключ Локи. Флот Сурта начинает наступление на Иггдрасиль, а Тирка, Фрейя и Один попадают в плен.
  spoiler: true
  scene: s604

- title: В поисках силы. Освобождение богинь
  paragraphs:
  - Фена рассказывает Локи, что по приказу Мении годами уверяла его, будто Синмара ещё жива. Локи оставляет Фену при себе и идёт освобождать богинь. Тирку держат в Трудхейме, Фрейю возят по Эдде, а Один выставляют в Гладсе в виде ледяной статуи. На этих же этапах могут вернуться Йорм, Хель и Фенрир, если они прежде служили Локи.
  - Во время нового штурма «Театра» Фена сдерживает своим зонтом взрыв големов, чтобы спасти отряд. После взрыва Локи считает её погибшей. Он бьёт по Ле Ветейну, где Сурт хранил тело Синмары. Гроб отзывается на Сердце Иггдрасиля и показывает прошлое Синмары. Один извлекла её душу и лишила памяти, чтобы создать Тирку. Сурт забрал тело и оставил до дня, когда ему понадобится новый сосуд. Теперь он требует у Локи Сердце Иггдрасиля. Здесь история расходится на обычную концовку, Порядок и Хаос.
  spoiler: true
  scene: s701, s702a, s702b, s702c, s703, s704
  image: chapters/g

- title: Обычная концовка. Пламя Хведрунга
  paragraphs:
  - Локи поворачивает ключ в собственном сердце. На этот раз Хведрунг получает столько силы, что обращается в пламя и сжигает Сурта вместе с телом Синмары. Фрейя пытается докричаться до него. Пламя отступает от богинь и вырывается наружу, где захватывает войска обеих сторон.
  - Сурт исчезает, у богинь едва хватает сил удержать Иггдрасиль в воздухе. Война стихает, когда обе стороны теряют возможность её продолжать. Позже Тирка находит на выжженном поле молодого человека, который не помнит своего имени. Он служит ей в Эдде и становится военным советником Иггдрасиля.
  spoiler: true
  scene: s705_end

- title: Порядок. Утгард над Вальхаллой
  paragraphs:
  - Локи отказывается отдать Сердце Иггдрасиля, но Сурт забирает его силой. На сцене «Театра» Сурт вставляет ключ в магическое устройство и переносит весь Утгард из мира демонов прямо над Вальхаллой. Столкновение погубит оба города. Тирка призывает дух Имира, и с его помощью Локи разбивает Ле Ветейн. Высвободившейся силой он повреждает формулу на сцене. Утгард сходит с курса, и Локи успевает начать наступление, пока Сурт восстанавливает формулу.
  - Если Локи вернул Хель, Фенрир и Йорм, их мать Дисир можно призвать с помощью Нибелунга. На подступах к дворцу Локи и Тирка сражаются с Фарбой. Сурт призвал его из мёртвых, но отец хочет сам узнать, на что способен сын. После поединка путь во дворец открыт.
  spoiler: true
  scene: s706, s801, xs91, xs92, xs93, s803
  image: chapters/h

- title: Порядок. Посадка Утгарда
  paragraphs:
  - В последнем бою Мения, пытавшаяся заменить погибшую сестру, встаёт на пути Сурта. Локи даёт ей понять, что давно узнал её. Он обращает силу удара Сурта против него самого и уничтожает Сейгьярн вместе с телом Синмары. Утгард всё ещё падает. Локи переписывает формулу Сурта, чтобы посадить город на поверхность. Хведрунг и богини отдают ему силу, а Сердце Иггдрасиля распадается.
  - В одном финале Утгард восстанавливается на поверхности и торгует с Иггдрасилем, пока Локи обследует земли внизу. В другом Локи объединяет земли богинь и Утгард под своей властью и назначает Хель управлять бывшей столицей. В обоих случаях предстоит готовиться ко дню, когда Иггдрасиль лишится высоты.
  spoiler: true
  scene: s805, s806_end, s807_end

- title: Хаос. Возвращение силы Один
  paragraphs:
  - На этой ветке Локи одолевает Сурта ещё на «Театре» и получает его меч Сейгьярн. Один нападает сразу после победы, срезает шнурок на шее Локи и забирает Сердце Иггдрасиля. Она вставляет ключ себе в грудь и возвращает прежнюю силу. Локи успевает уйти с «Театра» благодаря Фене и Мении, которые выжили после взрыва. Один забирает четырёх сезонных богинь, лишает их воспоминаний о Локи и ставит охранять дороги к Вальхалле.
  - Локи собирает уцелевших бойцов Сурта и возвращает богинь по одной. Первый поход зависит от выбора игрока. В подземелье Вальхаллы Один показывает новое Сердце Иггдрасиля. С его помощью она собирается подчинить людей своей воле. Мения и Йорм проникают к ней сверху и приносят Ле Ветейн, который забирает часть её божественной силы. Локи ломает Гунгнир и подчиняет Один.
  - В основном финале новый Владыка правит Иггдрасилем и миром демонов. Если игрок довёл до конца падение всех четырёх сезонных богинь, открывается другая концовка. Локи отдаёт пленённую Один её созданиям, чтобы они сделали её такой же служанкой, какими стали сами.
  spoiler: true
  scene: s707, s851, s852a, s852b, s852c, s852d, s853, s854, s855_end, zw07
  image: chapters/i
