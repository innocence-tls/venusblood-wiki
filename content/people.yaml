- key: Loki
  name: Локи
  role: Претендент на трон
  bio: После казни отца наследник лишился родового оружия. При дворе его считают сыном изменника, но на совете он всё равно заявляет о своём праве на престол. В походе ему пригодятся и отцовские уроки владения копьём, и магия, которой его учила наставница.
  related: Fena Garm Surt

- key: Fena
  name: Фена
  role: Наставница принца
  bio: Служит в доме принца с его детства. Она обучила воспитанника этикету и основам магии. На людях безупречно соблюдает придворные условности, а наедине может отчитать его за очередную выходку.
  related: Loki Garm

- key: Garm
  name: Гарм
  role: Стрелок
  bio: Ещё при отце принца командовал отрядом подавления беспорядков. Годы спустя отправился вместе с его сыном на парящий континент. В бою полагается на арбалет.
  related: Loki Fena

- key: Odin
  name: Один
  role: Хранительница святилища
  bio: После великой войны создала парящий континент и четырёх богинь, которым поручила его защиту. На это ушло столько сил, что она утратила прежний облик и часть воспоминаний. Из святилища в центре материка спускается лишь в час большой опасности.
  related: Tyrca Thor Freya Rigret

- key: Tyrca
  name: Тирка
  role: Богиня весны
  bio: Третья из четырёх сестёр покровительствует торговцам, скотоводам и танцорам. Её владения лежат среди восточных лугов. По оживлённым рынкам можно судить и о нраве самой хозяйки. Её оружие — Нибелунг, Меч верности. С его помощью Тирка призывает духов героев и может принять их силу в себя.
  related: Odin Thor Freya Rigret

- key: Thor
  name: Тор
  role: Богиня лета
  bio: Вторая по старшинству сестра ведает военным делом, охотой и добычей руды. Южная страна обязана ей своей армией. Воинскую доблесть богиня ценит в каждом, кто способен проявить себя в бою. В бою Тор мечет Мьёльнир, Секиру божественного грома. После броска ей нужно время, чтобы вновь зарядить оружие.
  related: Odin Tyrca

- key: Freya
  name: Фрейя
  role: Богиня осени
  bio: Старшая сестра покровительствует земледелию, искусствам и учёным. Её брак со смертным королём скрепил дружбу людей и богов. Через своих почитателей она узнаёт о событиях далеко за пределами западных земель.
  related: Odin Rigret

- key: Rigret
  name: ''
  role: Богиня зимы
  bio: Младшая из сестёр хранит северные земли, где метели испытывают людей на прочность. Здесь под её защитой развиваются ремёсла, рыбный промысел и музыка. Перед подданными она держится строже, чем в кругу семьи. Своим Щитом освобождения, Гьяллархорном, Ригрет дарует союзникам благословение и усиливает их в бою.
  related: Odin Freya

- key: Surt
  name: Сурт
  role: Владыка демонов
  bio: Правитель империи демонов и дед претендентов на престол. Даже наследников он принимает за занавесом. При дворе гадают, что заставило его скрыться от чужих глаз.
  related: Loki Hel Fenrir Jorm Ymir Menia

- key: Hel
  name: Хель
  role: Старшая из трёх сестёр
  bio: При дворе её считают главной претенденткой на престол. В бою она владеет водой, ветром и молнией. На совете наследников именно она первой требует объяснений у явившегося без приглашения кузена. Бликьяндаболь позволяет ей управлять погодой. В бою с Локи Хель взмахивает сияющим полотном, вызывает молнии и окружает себя вихрем. В других сценах Бликьяндаболь называют её косой.
  related: Fenrir Jorm Loki

- key: Fenrir
  name: Фенрир
  role: Вторая из трёх сестёр
  bio: Наследница путешествует по миру демонов в поисках развлечений. Её тяготят обязанности при дворе, хотя происхождение даёт ей право участвовать в споре за власть. Её оружие — плеть Свати.
  related: Hel Jorm

- key: Jorm
  name: Йорм
  role: Младшая из трёх сестёр
  bio: В споре быстро выходит из себя, а в схватке пускает в ход проклятые когти. Командование обычно поручает подчинённым. В поединке способна потягаться с другими наследниками.
  related: Hel Fenrir

- key: Ymir
  name: Имир
  role: Багряный принц
  bio: Старший из наследников сочетает мягкие манеры с талантом стратега. Сестра превосходит его в ближнем бою, зато при дворе мало кто сравнится с ним в политическом расчёте.
  related: Surt Hel

- key: Menia
  name: ''
  role: Секретарь правителя
  bio: Ведёт внутренние дела империи и исполняет распоряжения Владыки демонов. Пока сам правитель скрыт от глаз двора, его канцелярия продолжает работать.
  related: Surt

- key: Hvedrung
  name: Хведрунг
  role: Бог конца света
  bio: Пробуждается в крови младшего претендента на престол. Хотя у них одно тело, в бою проявляются совсем другой нрав и другая сила.
  related: Loki
