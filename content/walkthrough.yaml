- title: 1. Начните сюжетную кампанию
  paragraphs:
  - Для прохождения сюжета запустите обычную кампанию. В Battle Royale остаются сражения без сюжетных глав. Если хотите сначала прочитать историю или освоиться с картой, выберите «Легко» (Easy). На экране подготовки к бою на этой сложности есть кнопка мгновенной победы «Победа». За неё не начисляются опыт и очки результата, поэтому обычные бои пригодятся для развития армии.
  - Посмотрите пролог и сделайте отдельное сохранение на первой карте. Кампания всегда начинается с Эдды. На карте нажмите на соседнюю вражескую землю, чтобы посмотреть гарнизон, а затем на портрет противника, чтобы открыть подготовку к бою. Выберите свой основной отряд и вражеский отряд, с которым он будет сражаться. Перед первым наступлением проверьте текущие ОЗ, сколько провизии и магии уйдёт за бой и нет ли у врага навыков, которыми он обходит вашу защиту.
  - На обычном ходу есть шесть действий. Наём и вызов героинь их расходуют, а начало боя завершает ход и сжигает остаток действий. Сначала сделайте то, что запланировали на этот ход, потом наступайте. Если вашей земле уже угрожают, подготовка к обороне откроется при завершении хода.
  spoiler: false

- title: 2. Соберите отряд и возьмите Эдду
  paragraphs:
  - Откройте «Отряды» и перетащите бойцов в ячейки основного отряда. В нём помещается шесть бойцов. Страж с «Защитной тактикой» на первой позиции перехватывает прямые атаки по союзникам за собой. Дальние атаки и атаки в обход этот навык не остановит. Чтобы открыть тактические навыки в бою, включите в отряд хотя бы одного командира.
  - После боя проверяйте ОЗ в «Плане» и лечите основной отряд перед следующим штурмом. Если отправить раненого бойца сразу, его текущие ОЗ станут его пределом на время боя. При найме смотрите на улыбающийся значок. Он показывает выгодное сочетание фазы луны и времени суток. На поле боя совпадение стихии с луной усиливает обе армии, а противоположная стихия получает штраф к параметрам.
  - На карте отнимайте земли у Эдды и следите за мощью противника в «Сводке». Обычная территория даёт 1 очко, столица — 3. При 11 мощи или ниже начнётся первая сцена, в которой можно принять бой или отступить. После неё снижайте мощь до 2 или ниже. Заключительная сцена завершает главу, и оставшиеся земли Эдды переходят к Локи.
  - Смотрите, какие приказы выставлены у запасных отрядов. Приказ «Атака» отправляет отряд в автоматическую стычку с оставшимися войсками на атакованной территории. «Защита» нужна против вторжений на свои земли. Стычки длятся один раунд, основной бой рассчитан на пять.
  spoiler: false

- title: 3. Выберите порядок походов
  paragraphs:
  - После Эдды появятся четыре варианта. «Фольк, страна осени» (Nation of Autumn Folk), «Трудхейм, страна лета» (Nation of Summer Thrudheim), «Гладс, страна зимы» (Nation of Winter Glads) и «Вальхалла, священная земля» (Holy Land of Valhalla). В начале глав 2, 3 и 4 выбирайте любую оставшуюся землю. В главе 5 игра автоматически отправит вас в последнюю. Все четыре похода входят в общую кампанию.
  - Выбирайте раньше страну той героини, чьи встречи хотите успеть открыть. После победы она пополнит армию, и у вас будет больше ходов для её событий в меню «Вызов». После присоединения ставьте нужной героине «Общение» и проверяйте, появилась ли кнопка встречи. При одном активном режиме его шкала получает два очка за ход. Если включены оба режима, каждый получает по одному.
  - Очки общения открывают встречи. Для эпилогов важна отдельная цифра симпатии на портрете героини. Она меняется от ответов и событий. Смотрите доступные встречи до решающего штурма, особенно если их условие ограничено номером главы.
  spoiler: false

- title: 4. Что закрывает каждый из четырёх походов
  paragraphs:
  - Фольк. Снижайте его мощь до 9, затем до 6 и до 2. На этих порогах последовательно открываются сюжетные эпизоды. В первом «Погнаться следом» (Pursue) даёт +1 к Власти, «Оставить в покое» (Ignore) даёт +1 к симпатии Фены. При 2 очках мощи откроется решающий бой Фрейи.
  - Трудхейм. В первом разговоре можно принять предложение Фенрир кнопкой «Заключить союз» (Form an Alliance) или отказаться. Согласие открывает отдельный эпизод при мощи Трудхейма 9 или ниже, где «Казнить» (Execute them) даёт +1 к Захвату, а «Пока оставить на свободе» (Let them live) даёт +1 к Власти. Чтобы продвинуться дальше, сведите мощь сил Фенрир к нулю и пройдите её сцену. Фенрир присоединится. Тогда мощь Трудхейма 2 или ниже откроет решающий эпизод Тор.
  - Гладс. При мощи 11 или ниже появится Йорм. Чтобы взять её в союзницы, выберите «Атаковать корпус големов» (Attack the Golem Corp) и выиграйте первый сюжетный бой. Затем сведите мощь её отдельной армии к нулю и выиграйте второй сюжетный бой у установки. Только после двух побед появится «Схватить её» (Capture her). Выберите этот вариант, чтобы Йорм вступила в армию. После её эпизода снижайте мощь Гладса до 2 или ниже для финала Ригрет.
  - Вальхалла. «Пообещать сотрудничать» (Promise to cooperate) включает временный союз с Хель и даёт дополнительный эпизод при мощи Вальхаллы 7 или ниже. «Не играть на руку Хель» (Don't play into Hel's plans) означает отказ и даёт +1 к Захвату и +1 к симпатии Хель. Сведите мощь Хель к нулю и пройдите её сюжетную встречу. Она вступит в армию. После этого мощь Вальхаллы 2 или ниже откроет бой с Один.
  spoiler: true

- title: 5. Наберите очки для нужной ветки
  paragraphs:
  - Откройте «Вызов» и смотрите две шкалы кампании. Сверху Захват (Conquest), снизу Власть (Reign). Они начинаются с нуля и меняются от конкретных ответов. Чтобы открыть Порядок, ведите Власть к 20 и держите Захват ниже 30. Чтобы гарантировать Хаос, доведите Захват до 30. Если нужна возможность выбрать любую концовку с одного сохранения, добейтесь Власти 20 или выше и Захвата от 20 до 29 включительно.
  - Первые проверенные ответы. В Эдде «Дайте отпор!» (Fight back!) даёт +1 к Захвату, «Немедленно отведите войска!» (Retreat immediately!) даёт +1 к Власти. В разговоре с Феной в начале второй главы «Я уже готов» (I'm prepared for anything) даёт +1 к Захвату, «Даже не собираюсь» (Not in the least) даёт +1 к Власти и +1 к симпатии Фены. В сцене моста с Тиркой «Обрушить мост» (Destroy the bridge) даёт +1 к Захвату, «Устроить здесь рубеж обороны» (Set up a defensive line here) даёт +1 к Власти.
  - Запасные очки ищите во встречах. В первых двух разговорах Тирки «Отмахнуться со смехом» (Laugh It Off) и «Не трать время попусту» (Don't waste your time) дают по +1 к Захвату, а «Подбодрить Тирку» (Cheer Up Tyrca) и «Ну попробуй, если сможешь» (Try it, if you can) повышают её симпатию. Когда Ригрет расскажет, где училась тактике, «Мне тоже покажи» (Show them to me) даст +1 к Власти, а «Как и ожидалось от тебя, Ригрет» (Impressive, Rigret) — +1 к её симпатии. В первом разговоре Один о своём жилье «Пусть делает что хочет» (Let her do as she wishes) даёт +1 к Власти, «Пригрозить, что развращу её» (Threaten to corrupt her) даёт +1 к Захвату и +1 к её симпатии.
  - Лучше набирать нужные значения во время глав 2–5. В начале шестой главы часть командиров уходит, а некоторые события завязаны на окно сюжетных глав. Если приоритет — личная концовка, проверяйте и симпатию после каждого ответа. Очко симпатии и очко Власти или Захвата могут начисляться по разным вариантам одного диалога.
  spoiler: true

- title: 6. Дойдите до главной развилки
  paragraphs:
  - После четвёртого похода начинается общая глава 6 «Хранитель ключа» (Holder of the Key). Ранее присоединившиеся Хель, Фенрир и Йорм уйдут из армии. Проверьте освободившиеся ячейки в отрядах. Через два хода от начала главы запускается эпизод культа Конца Света. Сведите мощь отрядов Имира к нулю и оставьте культу не больше двух территорий. После следующего сюжетного эпизода возьмите Южное крыло «Театра» (Auditorium South), чтобы завершить главу.
  - В главе 7 «В поисках силы» (In Search of Power) займите три столицы. При взятии Тройсдорфа (Troisdorf) вернётся Йорм, Турку (Turku) — Хель, Эрншёльда (Ornskold) — Фенрир, если соответствующая сестра уже была у вас до начала главы 6. После третьего спасения начнётся военный совет. Затем сведите мощь армии Утгарда к нулю, чтобы запустить решающую сцену на «Театре». Сделайте отдельное сохранение до последнего штурма.
  spoiler: true

- title: 7. Как игра выбирает концовку
  paragraphs:
  - При Захвате 30 и выше игра сразу отправляет в Хаос. Если обе шкалы ниже 20, срабатывает обычная концовка. При Власти 20 и выше и Захвате ниже 20 автоматически начнётся Порядок. При Власти ниже 20 и Захвате от 20 до 29 автоматически начнётся Хаос.
  - Если Власть достигла 20, а Захват держится в диапазоне 20–29, появится меню из трёх вариантов. «Отдать Сердце Иггдрасиля» (Hand over the Heart) ведёт к обычной концовке. «...Я не могу отдать Сердце Иггдрасиля.» (...I can't give you the Heart.) открывает главу 8 Порядка. «Противостоять Сурту до конца» (Utterly defy Surt) открывает главу 8 Хаоса.
  - Если меню не появилось, игра применила один из автоматических порогов. Чтобы получить все три ветки из одного прохождения, подготовьте обе шкалы до последнего штурма главы 7 и сохранитесь отдельно.
  spoiler: true

- title: 8. Как завершить Порядок
  paragraphs:
  - На ветке Порядка наступайте на Утгард. Если вернулись все три демонические сестры, в начале главы откроется история Дисир. Для её прохождения займите Тёмный лес Снорри (Snorri Darkwood), Огненное поле Бьёрна (Bjorn Firefield), Огненное поле Сонаторрек (Sonatorrek Firefield) и Землю мертвецов Эгира (Aegir Corpseland) и снизьте мощь Утгарда до 12 или ниже. В обычном ходе главы тот же рубеж мощи открывает первый крупный сюжетный бой. Следующий эпизод открывается при 5 очках мощи или ниже.
  - После эпизода при мощи 5 или ниже сразу начнётся встреча перед финалом. Сделайте сохранение до штурма, на котором пересечёте этот порог. При симпатии 6 и выше становится доступна встреча с соответствующей богиней. Вариант встречи с тремя сёстрами требует по 6 у Хель, Фенрир и Йорм. Если подходит только одна встреча, она запускается сама. Если доступно несколько вариантов, выберите нужный. Он определит личный эпилог.
  - Продолжайте наступление через Королевские врата Гюльви (Gylfi's Royal Gate) к дворцу Утгарда и сведите мощь противника к нулю. При Власти не меньше Захвата срабатывает один основной финал, при перевесе Захвата — другой. Для отдельного эпилога Фены нужна симпатия 9, а дополнительная сцена после титров открывается при 12.
  spoiler: true

- title: 9. Как завершить Хаос
  paragraphs:
  - В начале финальной главы выберите, с какой из четырёх богинь начать. Выбор определяет стартовое ущелье. Тирка связана с Небесным ущельем Форссы (Forssa Skygorge), Тор — с Небесным ущельем Ростока (Rostock Skygorge), Фрейя — с Небесным ущельем Лены (Lena Skygorge), Ригрет — с Небесным ущельем Муры (Mora Skygorge). Занятие каждого ущелья запускает отдельный эпизод и возвращает соответствующую богиню.
  - Чтобы открыть решающий бой, сведите мощь новой армии Вальхаллы к нулю. Игра также пропустит к нему при мощи 2 или ниже, если Валаcкьяльв (Valaskjalf) уже ваш. Для альтернативного основного финала пройдите цепочки падения всех четырёх сезонных богинь. После возвращения каждой проверьте «Вызов». В последней развилке Тирки выберите «Преобразить Тирку» (Transform Tyrca) в версии для всех возрастов или равнозначный вариант превращения в версии 18+. У Фрейи выберите второй вариант, у Тор — «Поддаться желанию» (Follow your desires), у Ригрет — «Ригрет, стань моей марионеткой.» (Rigret, be my puppet.). Сохранитесь перед захватом Валаскьяльва. Как только выполнено условие победы, игра перейдёт к финальным сценам.
  - Личный эпилог Хаоса выбирается автоматически. Альтернативный основной финал открывает особый эпилог Один. Следом по приоритету идёт эпилог Фены и Мении, если пройдена их совместная встреча в главе 8 и симпатия Фены не ниже 8. Далее проверяется симпатия 6 у всех девяти героинь, затем отдельное условие по 6 у всех трёх демонических сестёр. Если ни одно из этих условий не выполнено, личный эпилог может достаться одной из четырёх сезонных богинь с наибольшей симпатией, начиная с 6. При равенстве приоритет у Тирки, затем Фрейи, Тор и Ригрет. Для Один действует особое условие выше.
  spoiler: true
